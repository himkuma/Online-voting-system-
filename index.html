<!DOCTYPE html>
<html>
<head>
    <title>Online Voting System</title>
    <style>
        body {
            font-family: Arial;
            background: #e8f0ff;
            text-align: center;
        }

        .container {
            background: white;
            width: 350px;
            margin: 50px auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 10px gray;
        }

        input, button {
            padding: 10px;
            margin: 8px;
            width: 85%;
        }

        button {
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

        h2 {
            color: blue;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Online Voting System</h2>

    <input type="text" id="name"
    placeholder="Enter Your Name">

    <input type="text" id="voter"
    placeholder="Enter Voter ID">

    <h3>Select Your Candidate</h3>

    <button onclick="vote('Hardik chadva')">
        Vote Hardik chadva
    </button>

    <button onclick="vote('megna mam')">
        Vote megna mam
    </button>

    <button onclick="vote('Rohit')">
        Vote Rohit
    </button>

    <h3>Voting Results</h3>

    <p>Rahul: <span id="r">0</span></p>
    <p>Aman: <span id="a">0</span></p>
    <p>Rohit: <span id="ro">0</span></p>

    <h3 id="message"></h3>

</div>

<script>

let votes = {
    Hardik chadva: 0,
    megna mam: 0,
    Rohit: 0
};

let voted = [];

function vote(candidate) {

    let name = document.getElementById("name").value;
    let voter = document.getElementById("voter").value;

    if (name === "" || voter === "") {
        alert("Please enter your details!");
        return;
    }

    if (voted.includes(voter)) {
        alert("You have already voted!");
        return;
    }

    votes[candidate]++;
    voted.push(voter);

    document.getElementById("r").innerText = votes.Hardik chadva
    document.getElementById("a").innerText = votes.megna mam
    document.getElementById("ro").innerText = votes.Rohit;

    document.getElementById("message").innerText =
        "Vote Successfully Submitted!";

}

</script>

</body>
</html>
